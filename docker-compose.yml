version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: idp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: idp
      POSTGRES_USER: idp
      POSTGRES_PASSWORD: ***REMOVED***
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idp -d idp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: idp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: backend/auth-service/Dockerfile
    container_name: idp-auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: idp
      DB_PASSWORD: ***REMOVED***
      DB_NAME: idp
      DB_SCHEMA: auth
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: local-dev-only-secret-change-in-production
      JWT_ACCESS_TOKEN_TTL_SECONDS: 900
      JWT_REFRESH_TOKEN_TTL_SECONDS: 604800
      JWT_ISSUER: idp-platform
      ALLOWED_ORIGINS: http://localhost:5173

  service-catalog-service:
    build:
      context: .
      dockerfile: backend/service-catalog-service/Dockerfile
    container_name: idp-service-catalog
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: idp
      DB_PASSWORD: ***REMOVED***
      DB_NAME: idp
      DB_SCHEMA: catalog
      JWT_SECRET: local-dev-only-secret-change-in-production
      JWT_ISSUER: idp-platform
      ALLOWED_ORIGINS: http://localhost:5173

  repository-service:
    build:
      context: .
      dockerfile: backend/repository-service/Dockerfile
    container_name: idp-repository-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: development
      PORT: 3003
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: idp
      DB_PASSWORD: ***REMOVED***
      DB_NAME: idp
      DB_SCHEMA: repository
      JWT_SECRET: local-dev-only-secret-change-in-production
      JWT_ISSUER: idp-platform
      ALLOWED_ORIGINS: http://localhost:5173
      # Set your real GitHub token here for local dev
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_OWNER: ${GITHUB_OWNER:-your-github-username}

  template-service:
    build:
      context: .
      dockerfile: backend/template-service/Dockerfile
    container_name: idp-template-service
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: development
      PORT: 3004
      JWT_SECRET: local-dev-only-secret-change-in-production
      JWT_ISSUER: idp-platform
      ALLOWED_ORIGINS: http://localhost:5173

volumes:
  postgres_data:
  redis_data: