version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# IDP Platform — Local Development Stack (No AWS, all free)
#
# Usage:
#   docker compose up -d                          # core 4 services
#   docker compose --profile stubs up -d          # add all 7 stub services
#   docker compose --profile full up -d           # add frontend container
#   docker compose logs -f auth-service           # tail service logs
#   docker compose down -v                        # stop + delete volumes
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Infrastructure ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: idp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: idp
      POSTGRES_USER: idp
      POSTGRES_PASSWORD: ***REMOVED***
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idp -d idp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: idp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: idp-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus-compose.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.2.0
    container_name: idp-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ***REMOVED***
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  loki:
    image: grafana/loki:3.1.1
    container_name: idp-loki
    restart: unless-stopped
    user: "0:0"
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki/loki-config.yaml
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
  
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: idp-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 3

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: idp-otel-collector
    restart: unless-stopped
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./monitoring/otel/otel-collector-config.yaml:/etc/otel/otel-collector-config.yaml:ro
    command: --config=/etc/otel/otel-collector-config.yaml
  
      
  # ── Phase 1: Auth ─────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: backend/auth-service/Dockerfile
      args:
        BUILD_REVISION: local
        BUILD_DATE: "2024-01-01T00:00:00Z"
    container_name: idp-auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: idp
      DB_PASSWORD: ***REMOVED***
      DB_NAME: idp
      DB_SCHEMA: auth
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ***REMOVED***
      JWT_ACCESS_TOKEN_TTL_SECONDS: 900
      JWT_REFRESH_TOKEN_TTL_SECONDS: 604800
      JWT_ISSUER: idp-platform
      ALLOWED_ORIGINS: http://localhost:5173
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Phase 2: Service Catalog ──────────────────────────────────────────────────
  service-catalog-service:
    build:
      context: .
      dockerfile: backend/service-catalog-service/Dockerfile
      args:
        BUILD_REVISION: local
        BUILD_DATE: "2024-01-01T00:00:00Z"
    container_name: idp-service-catalog
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: idp
      DB_PASSWORD: ***REMOVED***
      DB_NAME: idp
      DB_SCHEMA: catalog
      JWT_SECRET: ***REMOVED***
      JWT_ISSUER: idp-platform
      ALLOWED_ORIGINS: http://localhost:5173
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Phase 3: Repository ───────────────────────────────────────────────────────
  repository-service:
    build:
      context: .
      dockerfile: backend/repository-service/Dockerfile
      args:
        BUILD_REVISION: local
        BUILD_DATE: "2024-01-01T00:00:00Z"
    container_name: idp-repository-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: development
      PORT: 3003
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: idp
      DB_PASSWORD: ***REMOVED***
      DB_NAME: idp
      DB_SCHEMA: repository
      JWT_SECRET: ***REMOVED***
      JWT_ISSUER: idp-platform
      ALLOWED_ORIGINS: http://localhost:5173
      GITHUB_TOKEN: ${GITHUB_TOKEN:-your-github-pat-here}
      GITHUB_OWNER: ${GITHUB_OWNER:-your-github-username}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Phase 4: Template Engine ──────────────────────────────────────────────────
  template-service:
    build:
      context: .
      dockerfile: backend/template-service/Dockerfile
      args:
        BUILD_REVISION: local
        BUILD_DATE: "2024-01-01T00:00:00Z"
    container_name: idp-template-service
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: development
      PORT: 3004
      JWT_SECRET: ***REMOVED***
      JWT_ISSUER: idp-platform
      ALLOWED_ORIGINS: http://localhost:5173
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Phase 5 stubs (full implementation Phase 6–9) ─────────────────────────────
  deployment-service:
    build:
      context: .
      dockerfile: backend/deployment-service/Dockerfile
      args:
        BUILD_REVISION: local
        BUILD_DATE: "2024-01-01T00:00:00Z"
    container_name: idp-deployment-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: development
      PORT: 3005
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: idp
      DB_PASSWORD: ***REMOVED***
      DB_NAME: idp
      JWT_SECRET: ***REMOVED***
      JWT_ISSUER: idp-platform
      ALLOWED_ORIGINS: http://localhost:5173
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3005/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  monitoring-service:
    build:
      context: .
      dockerfile: backend/monitoring-service/Dockerfile
      args:
        BUILD_REVISION: local
    container_name: idp-monitoring-service
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      NODE_ENV: development
      PORT: 3006
      JWT_SECRET: ***REMOVED***
      JWT_ISSUER: idp-platform
      PROMETHEUS_URL: http://prometheus:9090
      ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3006/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  logging-service:
    build:
      context: .
      dockerfile: backend/logging-service/Dockerfile
      args:
        BUILD_REVISION: local
    container_name: idp-logging-service
    restart: unless-stopped
    ports:
      - "3007:3007"
    environment:
      NODE_ENV: development
      PORT: 3007
      JWT_SECRET: ***REMOVED***
      JWT_ISSUER: idp-platform
      LOKI_URL: http://loki:3100
      ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3007/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  alert-service:
    build:
      context: .
      dockerfile: backend/alert-service/Dockerfile
      args:
        BUILD_REVISION: local
    container_name: idp-alert-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    ports:
      - "3008:3008"
    environment:
      NODE_ENV: development
      PORT: 3008
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: idp
      DB_PASSWORD: ***REMOVED***
      DB_NAME: idp
      DB_SCHEMA: alert
      JWT_SECRET: ***REMOVED***
      JWT_ISSUER: idp-platform
      ALERTMANAGER_URL: http://alertmanager:9093
      WEBHOOK_TOKEN: ***REMOVED***
      ALLOWED_ORIGINS: http://localhost:5173
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3008/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  notification-service:
    build:
      context: .
      dockerfile: backend/notification-service/Dockerfile
      args:
        BUILD_REVISION: local
    container_name: idp-notification-service
    restart: unless-stopped
    ports:
      - "3009:3009"
    environment:
      NODE_ENV: development
      PORT: 3009
      JWT_SECRET: ***REMOVED***
      JWT_ISSUER: idp-platform
      WEBHOOK_TOKEN: ***REMOVED***
      ALLOWED_ORIGINS: http://localhost:5173
      # Set these to activate channels:
      # SLACK_WEBHOOK_URL: https://hooks.slack.com/services/...
      # DISCORD_WEBHOOK_URL: https://discord.com/api/webhooks/...
      # GENERIC_WEBHOOK_URL: https://your-webhook.com/hook
      # SMTP_HOST: smtp.gmail.com
      # SMTP_PORT: 587
      # SMTP_USER: your@gmail.com
      # SMTP_PASS: your-app-password
      # ALERT_EMAIL_TO: team@yourcompany.com
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3009/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Phase 9 services ──────────────────────────────────────────────────────
  audit-service:
    build:
      context: .
      dockerfile: backend/audit-service/Dockerfile
      args:
        BUILD_REVISION: local
    container_name: idp-audit-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3010:3010"
    environment:
      NODE_ENV: development
      PORT: 3010
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: idp
      DB_PASSWORD: ***REMOVED***
      DB_NAME: idp
      JWT_SECRET: ***REMOVED***
      JWT_ISSUER: idp-platform
      ALLOWED_ORIGINS: http://localhost:5173
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3010/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  cost-service:
    build:
      context: .
      dockerfile: backend/cost-service/Dockerfile
      args:
        BUILD_REVISION: local
    container_name: idp-cost-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    ports:
      - "3011:3011"
    environment:
      NODE_ENV: development
      PORT: 3011
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: idp
      DB_PASSWORD: ***REMOVED***
      DB_NAME: idp
      JWT_SECRET: ***REMOVED***
      JWT_ISSUER: idp-platform
      # Docker Compose DNS
      PROMETHEUS_URL: http://prometheus:9090
      # Price model (AWS t3.medium equivalent rates)
      PRICE_CPU_PER_VCPU_HOUR: "0.048"
      PRICE_MEMORY_PER_GB_HOUR: "0.006"
      ALLOWED_ORIGINS: http://localhost:5173
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3011/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Phase 11 — AI Copilot ─────────────────────────────────────────────────
  ai-copilot-service:
    build:
      context: .
      dockerfile: backend/ai-copilot-service/Dockerfile
      args:
        BUILD_REVISION: local
    container_name: idp-ai-copilot-service
    restart: unless-stopped
    ports:
      - "3012:3012"
    environment:
      NODE_ENV: development
      PORT: 3012
      JWT_SECRET: ***REMOVED***
      JWT_ISSUER: idp-platform
      # Groq API
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: openai/gpt-oss-120b
      GROQ_MAX_TOKENS: "2048"
      # Docker Compose DNS — live platform data for context
      ALERT_SERVICE_URL: http://alert-service:3008
      COST_SERVICE_URL: http://cost-service:3011
      MONITORING_SERVICE_URL: http://monitoring-service:3006
      LOGGING_SERVICE_URL: http://logging-service:3007
      ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      alert-service:
        condition: service_healthy
      cost-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3012/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Frontend (use npm run dev locally; docker for testing builds) ─────────────
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        BUILD_REVISION: local
        BUILD_DATE: "2024-01-01T00:00:00Z"
    container_name: idp-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles: ["full"]

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alertmanager_data: