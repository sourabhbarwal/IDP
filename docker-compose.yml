version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# IDP Platform — Local Development Stack (No AWS, all free)
#
# Usage:
#   docker compose up -d                          # core 4 services
#   docker compose --profile stubs up -d          # add all 7 stub services
#   docker compose --profile full up -d           # add frontend container
#   docker compose logs -f auth-service           # tail service logs
#   docker compose down -v                        # stop + delete volumes
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Infrastructure ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: idp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: idp
      POSTGRES_USER: idp
      POSTGRES_PASSWORD: ***REMOVED***
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idp -d idp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: idp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Phase 1: Auth ─────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: backend/auth-service/Dockerfile
      args:
        BUILD_REVISION: local
        BUILD_DATE: "2024-01-01T00:00:00Z"
    container_name: idp-auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: idp
      DB_PASSWORD: ***REMOVED***
      DB_NAME: idp
      DB_SCHEMA: auth
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ***REMOVED***
      JWT_ACCESS_TOKEN_TTL_SECONDS: 900
      JWT_REFRESH_TOKEN_TTL_SECONDS: 604800
      JWT_ISSUER: idp-platform
      ALLOWED_ORIGINS: http://localhost:5173
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Phase 2: Service Catalog ──────────────────────────────────────────────────
  service-catalog-service:
    build:
      context: .
      dockerfile: backend/service-catalog-service/Dockerfile
      args:
        BUILD_REVISION: local
        BUILD_DATE: "2024-01-01T00:00:00Z"
    container_name: idp-service-catalog
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: idp
      DB_PASSWORD: ***REMOVED***
      DB_NAME: idp
      DB_SCHEMA: catalog
      JWT_SECRET: ***REMOVED***
      JWT_ISSUER: idp-platform
      ALLOWED_ORIGINS: http://localhost:5173
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Phase 3: Repository ───────────────────────────────────────────────────────
  repository-service:
    build:
      context: .
      dockerfile: backend/repository-service/Dockerfile
      args:
        BUILD_REVISION: local
        BUILD_DATE: "2024-01-01T00:00:00Z"
    container_name: idp-repository-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: development
      PORT: 3003
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: idp
      DB_PASSWORD: ***REMOVED***
      DB_NAME: idp
      DB_SCHEMA: repository
      JWT_SECRET: ***REMOVED***
      JWT_ISSUER: idp-platform
      ALLOWED_ORIGINS: http://localhost:5173
      GITHUB_TOKEN: ${GITHUB_TOKEN:-your-github-pat-here}
      GITHUB_OWNER: ${GITHUB_OWNER:-your-github-username}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Phase 4: Template Engine ──────────────────────────────────────────────────
  template-service:
    build:
      context: .
      dockerfile: backend/template-service/Dockerfile
      args:
        BUILD_REVISION: local
        BUILD_DATE: "2024-01-01T00:00:00Z"
    container_name: idp-template-service
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: development
      PORT: 3004
      JWT_SECRET: ***REMOVED***
      JWT_ISSUER: idp-platform
      ALLOWED_ORIGINS: http://localhost:5173
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Phase 5 stubs (full implementation Phase 6–9) ─────────────────────────────
  deployment-service:
    build:
      context: .
      dockerfile: backend/deployment-service/Dockerfile
      args:
        BUILD_REVISION: local
        BUILD_DATE: "2024-01-01T00:00:00Z"
    container_name: idp-deployment-service
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: development
      PORT: 3005
      JWT_SECRET: ***REMOVED***
      JWT_ISSUER: idp-platform
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3005/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles: ["stubs"]

  monitoring-service:
    build:
      context: .
      dockerfile: backend/monitoring-service/Dockerfile
      args:
        BUILD_REVISION: local
        BUILD_DATE: "2024-01-01T00:00:00Z"
    container_name: idp-monitoring-service
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      NODE_ENV: development
      PORT: 3006
      JWT_SECRET: ***REMOVED***
      JWT_ISSUER: idp-platform
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3006/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles: ["stubs"]

  logging-service:
    build:
      context: .
      dockerfile: backend/logging-service/Dockerfile
      args:
        BUILD_REVISION: local
        BUILD_DATE: "2024-01-01T00:00:00Z"
    container_name: idp-logging-service
    restart: unless-stopped
    ports:
      - "3007:3007"
    environment:
      NODE_ENV: development
      PORT: 3007
      JWT_SECRET: ***REMOVED***
      JWT_ISSUER: idp-platform
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3007/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles: ["stubs"]

  alert-service:
    build:
      context: .
      dockerfile: backend/alert-service/Dockerfile
      args:
        BUILD_REVISION: local
        BUILD_DATE: "2024-01-01T00:00:00Z"
    container_name: idp-alert-service
    restart: unless-stopped
    ports:
      - "3008:3008"
    environment:
      NODE_ENV: development
      PORT: 3008
      JWT_SECRET: ***REMOVED***
      JWT_ISSUER: idp-platform
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3008/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles: ["stubs"]

  notification-service:
    build:
      context: .
      dockerfile: backend/notification-service/Dockerfile
      args:
        BUILD_REVISION: local
        BUILD_DATE: "2024-01-01T00:00:00Z"
    container_name: idp-notification-service
    restart: unless-stopped
    ports:
      - "3009:3009"
    environment:
      NODE_ENV: development
      PORT: 3009
      JWT_SECRET: ***REMOVED***
      JWT_ISSUER: idp-platform
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3009/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles: ["stubs"]

  audit-service:
    build:
      context: .
      dockerfile: backend/audit-service/Dockerfile
      args:
        BUILD_REVISION: local
        BUILD_DATE: "2024-01-01T00:00:00Z"
    container_name: idp-audit-service
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      NODE_ENV: development
      PORT: 3010
      JWT_SECRET: ***REMOVED***
      JWT_ISSUER: idp-platform
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3010/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles: ["stubs"]

  cost-service:
    build:
      context: .
      dockerfile: backend/cost-service/Dockerfile
      args:
        BUILD_REVISION: local
        BUILD_DATE: "2024-01-01T00:00:00Z"
    container_name: idp-cost-service
    restart: unless-stopped
    ports:
      - "3011:3011"
    environment:
      NODE_ENV: development
      PORT: 3011
      JWT_SECRET: ***REMOVED***
      JWT_ISSUER: idp-platform
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3011/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles: ["stubs"]

  # ── Frontend (use npm run dev locally; docker for testing builds) ─────────────
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        BUILD_REVISION: local
        BUILD_DATE: "2024-01-01T00:00:00Z"
    container_name: idp-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles: ["full"]

volumes:
  postgres_data:
  redis_data: