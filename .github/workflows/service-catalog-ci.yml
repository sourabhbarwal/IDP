name: service-catalog-service CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/service-catalog-service/**"
      - "backend/common/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/tsconfig.base.json"
      - ".github/workflows/service-catalog-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/service-catalog-service/**"
      - "backend/common/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/tsconfig.base.json"
      - ".github/workflows/service-catalog-ci.yml"

env:
  NODE_VERSION: "20"

jobs:
  lint-and-unit-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "npm", cache-dependency-path: backend/package-lock.json }
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Build common
        working-directory: backend
        run: npm run build --workspace=common
      - name: Lint
        working-directory: backend/service-catalog-service
        run: npm run lint
      - name: Unit tests with coverage
        working-directory: backend/service-catalog-service
        run: npm run test:cov
        env: { CI: true }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: catalog-coverage, path: backend/service-catalog-service/coverage/ }

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "npm", cache-dependency-path: backend/package-lock.json }
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Build common
        working-directory: backend
        run: npm run build --workspace=common
      - name: Integration tests
        working-directory: backend/service-catalog-service
        run: npm run test:e2e
        env: { CI: true, JWT_SECRET: ci-integration-test-secret-long-enough }

  build:
    name: TypeScript Build
    runs-on: ubuntu-latest
    needs: lint-and-unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "npm", cache-dependency-path: backend/package-lock.json }
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npm run build --workspace=common
      - working-directory: backend
        run: npm run build --workspace=service-catalog-service
      - uses: actions/upload-artifact@v4
        with: { name: catalog-dist, path: backend/service-catalog-service/dist/, retention-days: 7 }

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [integration-test, build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: service-catalog-service
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/service-catalog-service/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max