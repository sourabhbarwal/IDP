name: service-catalog-service CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/service-catalog-service/**"
      - "backend/common/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/tsconfig.base.json"
      - ".github/workflows/service-catalog-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/service-catalog-service/**"
      - "backend/common/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/tsconfig.base.json"
      - ".github/workflows/service-catalog-ci.yml"

env:
  NODE_VERSION: "20"

jobs:
  lint-and-unit-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - name: Audit production dependencies for vulnerabilities
        working-directory: backend
        run: npm audit --audit-level=critical --omit=dev --workspace=service-catalog-service
        continue-on-error: false
      - working-directory: backend
        run: npm run build --workspace=common
      - working-directory: backend/service-catalog-service
        run: npm run lint
      - working-directory: backend/service-catalog-service
        run: npm run test:cov
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-coverage
          path: backend/service-catalog-service/coverage/

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npm run build --workspace=common
      - working-directory: backend/service-catalog-service
        run: npm run test:e2e
        env:
          CI: true
          RYUK_DISABLED: "true"
          JWT_SECRET: ci-integration-test-secret-must-be-long-enough-for-hs256

  build:
    name: TypeScript Build
    runs-on: ubuntu-latest
    needs: lint-and-unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npm run build --workspace=common
      - working-directory: backend
        run: npm run build --workspace=service-catalog-service
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-dist
          path: backend/service-catalog-service/dist/
          retention-days: 7

  docker-build-and-scan:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [integration-test, build]
    permissions:
      contents: read
      security-events: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/service-catalog-service/Dockerfile
          push: false
          load: true
          tags: service-catalog-service:${{ github.sha }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: service-catalog-service:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          docker tag service-catalog-service:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/idp-service-catalog-service:sha-${SHORT_SHA}
          docker tag service-catalog-service:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/idp-service-catalog-service:latest
          docker push ghcr.io/${{ github.repository_owner }}/idp-service-catalog-service:sha-${SHORT_SHA}
          docker push ghcr.io/${{ github.repository_owner }}/idp-service-catalog-service:latest
          echo "✅ Pushed idp-service-catalog-service:sha-${SHORT_SHA} to GHCR"
