name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on semver tags: v1.0.0, v1.2.3, etc.

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog generation

      - name: Get version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          PREV_TAG=$(git tag --sort=-creatordate | grep -E '^v[0-9]' | sed -n '2p')

          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline --pretty=format:"- %s (%h)" | head -30)
          else
            COMMITS=$(git log ${PREV_TAG}..HEAD --oneline --pretty=format:"- %s (%h)")
          fi

          # Categorise commits by conventional commit type
          FEATURES=$(echo "$COMMITS" | grep "^- feat" || echo "")
          FIXES=$(echo "$COMMITS" | grep "^- fix" || echo "")
          DOCS=$(echo "$COMMITS" | grep "^- docs" || echo "")
          OTHER=$(echo "$COMMITS" | grep -v "^- feat\|^- fix\|^- docs" || echo "")

          # Build changelog markdown
          CHANGELOG="## What's Changed in ${{ steps.version.outputs.tag }}\n\n"

          if [ -n "$FEATURES" ]; then
            CHANGELOG+="### ✨ Features\n${FEATURES}\n\n"
          fi
          if [ -n "$FIXES" ]; then
            CHANGELOG+="### 🐛 Bug Fixes\n${FIXES}\n\n"
          fi
          if [ -n "$DOCS" ]; then
            CHANGELOG+="### 📚 Documentation\n${DOCS}\n\n"
          fi
          if [ -n "$OTHER" ]; then
            CHANGELOG+="### 🔧 Other Changes\n${OTHER}\n\n"
          fi

          # Docker images section
          CHANGELOG+="### 🐳 Docker Images\n"
          CHANGELOG+="All images available at \`ghcr.io/${{ github.repository_owner }}/idp-*:${{ steps.version.outputs.tag }}\`\n\n"
          CHANGELOG+="| Service | Image |\n|---|---|\n"

          SERVICES=(
            "auth-service" "service-catalog-service" "repository-service"
            "template-service" "deployment-service" "monitoring-service"
            "logging-service" "alert-service" "notification-service"
            "audit-service" "cost-service" "ai-copilot-service"
            "realtime-service" "frontend"
          )

          for SVC in "${SERVICES[@]}"; do
            CHANGELOG+="| ${SVC} | \`ghcr.io/${{ github.repository_owner }}/idp-${SVC}:${{ steps.version.outputs.tag }}\` |\n"
          done

          echo -e "$CHANGELOG" > CHANGELOG_BODY.md
          echo "Generated changelog for ${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "IDP Platform ${{ steps.version.outputs.tag }}"
          body_path: CHANGELOG_BODY.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-rc') || contains(steps.version.outputs.tag, '-beta') }}
          generate_release_notes: true

      - name: Trigger CD pipeline for release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cd-pipeline.yml',
              ref: context.ref,
              inputs: {
                environment: 'production'
              }
            });
            console.log('Triggered CD pipeline for release ${{ steps.version.outputs.tag }}');