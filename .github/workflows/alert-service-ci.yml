name: alert-service CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/alert-service/**"
      - "backend/common/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/tsconfig.base.json"
      - ".github/workflows/alert-service-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/alert-service/**"
      - "backend/common/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/tsconfig.base.json"
      - ".github/workflows/alert-service-ci.yml"

env:
  NODE_VERSION: "20"

jobs:
  lint-and-unit-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - name: Audit production dependencies for vulnerabilities
        working-directory: backend
        run: npm audit --audit-level=critical --omit=dev --workspace=alert-service
        continue-on-error: false
      - working-directory: backend
        run: npm run build --workspace=common
      - working-directory: backend/alert-service
        run: npm run lint
      - working-directory: backend/alert-service
        run: npm run test:cov
        env: { CI: true }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alert-svc-coverage
          path: backend/alert-service/coverage/

  build:
    name: TypeScript Build
    runs-on: ubuntu-latest
    needs: lint-and-unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npm run build --workspace=common
      - working-directory: backend
        run: npm run build --workspace=alert-service

  docker-build-and-scan:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/alert-service/Dockerfile
          push: false
          load: true
          tags: alert-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: alert-service:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          docker tag alert-service:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/idp-alert-service:sha-${SHORT_SHA}
          docker tag alert-service:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/idp-alert-service:latest
          docker push ghcr.io/${{ github.repository_owner }}/idp-alert-service:sha-${SHORT_SHA}
          docker push ghcr.io/${{ github.repository_owner }}/idp-alert-service:latest
          echo "✅ Pushed idp-alert-service:sha-${SHORT_SHA} to GHCR"
