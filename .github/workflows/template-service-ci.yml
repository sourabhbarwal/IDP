name: template-service CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/template-service/**"
      - "backend/common/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/tsconfig.base.json"
      - ".github/workflows/template-service-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/template-service/**"
      - "backend/common/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/tsconfig.base.json"
      - ".github/workflows/template-service-ci.yml"

env:
  NODE_VERSION: "20"

jobs:
  lint-and-unit-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "npm", cache-dependency-path: backend/package-lock.json }
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npm run build --workspace=common
      - working-directory: backend/template-service
        run: npm run lint
      - working-directory: backend/template-service
        run: npm run test:cov
        env: { CI: true }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: template-svc-coverage, path: backend/template-service/coverage/ }

  build:
    name: TypeScript Build
    runs-on: ubuntu-latest
    needs: lint-and-unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "npm", cache-dependency-path: backend/package-lock.json }
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npm run build --workspace=common
      - working-directory: backend
        run: npm run build --workspace=template-service
      - uses: actions/upload-artifact@v4
        with: { name: template-svc-dist, path: backend/template-service/dist/, retention-days: 7 }

  docker-build:
    name: Docker Build, Scan & Push
    runs-on: ubuntu-latest
    needs: [integration-test, build]

    permissions:
      contents: read
      id-token: write       # for OIDC ECR auth
      security-events: write # for Trivy SARIF upload

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: template-service
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch

      # Build and load locally for Trivy scanning
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/template-service/Dockerfile
          push: false
          load: true
          tags: template-service:${{ github.sha }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy vulnerability scan — fails on CRITICAL/HIGH
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: template-service:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      # ECR push — only on main branch, requires AWS OIDC secret
      - name: Configure AWS credentials (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        if: github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push to ECR
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/template-service/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/idp-platform/template-service:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/idp-platform/template-service:latest
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max