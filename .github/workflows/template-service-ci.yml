name: template-service CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/template-service/**"
      - "backend/common/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/tsconfig.base.json"
      - ".github/workflows/template-service-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/template-service/**"
      - "backend/common/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/tsconfig.base.json"
      - ".github/workflows/template-service-ci.yml"

env:
  NODE_VERSION: "20"

jobs:
  lint-and-unit-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "npm", cache-dependency-path: backend/package-lock.json }
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npm run build --workspace=common
      - working-directory: backend/template-service
        run: npm run lint
      - working-directory: backend/template-service
        run: npm run test:cov
        env: { CI: true }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: template-svc-coverage, path: backend/template-service/coverage/ }

  build:
    name: TypeScript Build
    runs-on: ubuntu-latest
    needs: lint-and-unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "npm", cache-dependency-path: backend/package-lock.json }
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npm run build --workspace=common
      - working-directory: backend
        run: npm run build --workspace=template-service
      - uses: actions/upload-artifact@v4
        with: { name: template-svc-dist, path: backend/template-service/dist/, retention-days: 7 }

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: template-service
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/template-service/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max