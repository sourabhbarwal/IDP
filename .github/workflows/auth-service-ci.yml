name: auth-service CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/auth-service/**"
      - "backend/common/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/tsconfig.base.json"
      - ".github/workflows/auth-service-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/auth-service/**"
      - "backend/common/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/tsconfig.base.json"
      - ".github/workflows/auth-service-ci.yml"

env:
  NODE_VERSION: "20"
  IMAGE_NAME: auth-service

jobs:
  # ───────────────────────────────────────────────────
  # Job 1: Lint + Unit Tests + Coverage
  # ───────────────────────────────────────────────────
  lint-and-unit-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build common library
        working-directory: backend
        run: npm run build --workspace=common

      - name: Lint (auth-service)
        working-directory: backend/auth-service
        run: npm run lint

      - name: Unit tests with coverage
        working-directory: backend/auth-service
        run: npm run test:cov
        env:
          CI: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-coverage
          path: backend/auth-service/coverage/

  # ───────────────────────────────────────────────────
  # Job 2: Integration Tests (Testcontainers)
  # ───────────────────────────────────────────────────
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-unit-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build common library
        working-directory: backend
        run: npm run build --workspace=common

      - name: Run integration tests
        working-directory: backend/auth-service
        run: npm run test:e2e
        env:
          CI: true
          JWT_SECRET: ci-integration-test-secret-long-enough
          JWT_ACCESS_TOKEN_TTL_SECONDS: "900"
          JWT_REFRESH_TOKEN_TTL_SECONDS: "604800"

  # ───────────────────────────────────────────────────
  # Job 3: Build TypeScript
  # ───────────────────────────────────────────────────
  build:
    name: TypeScript Build
    runs-on: ubuntu-latest
    needs: lint-and-unit-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build common library
        working-directory: backend
        run: npm run build --workspace=common

      - name: Build auth-service
        working-directory: backend
        run: npm run build --workspace=auth-service

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-dist
          path: backend/auth-service/dist/
          retention-days: 7

  # ───────────────────────────────────────────────────
  # Job 4: Docker Build
  # ───────────────────────────────────────────────────
  docker-build:
    name: Docker Build, Scan & Push
    runs-on: ubuntu-latest
    needs: [integration-test, build]

    permissions:
      contents: read
      id-token: write       # for OIDC ECR auth
      security-events: write # for Trivy SARIF upload

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: auth-service
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch

      # Build and load locally for Trivy scanning
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/auth-service/Dockerfile
          push: false
          load: true
          tags: auth-service:${{ github.sha }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy vulnerability scan — fails on CRITICAL/HIGH
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: auth-service:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      # ECR push — only on main branch, requires AWS OIDC secret
      - name: Configure AWS credentials (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        if: github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push to ECR
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/auth-service/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/idp-platform/auth-service:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/idp-platform/auth-service:latest
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max