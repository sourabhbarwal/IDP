name: auth-service CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/auth-service/**"
      - "backend/common/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/tsconfig.base.json"
      - ".github/workflows/auth-service-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/auth-service/**"
      - "backend/common/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/tsconfig.base.json"
      - ".github/workflows/auth-service-ci.yml"

env:
  NODE_VERSION: "20"

jobs:
  lint-and-unit-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Build common
        working-directory: backend
        run: npm run build --workspace=common
      - name: Lint
        working-directory: backend/auth-service
        run: npm run lint
      - name: Unit tests with coverage
        working-directory: backend/auth-service
        run: npm run test:cov
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-coverage
          path: backend/auth-service/coverage/

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Build common
        working-directory: backend
        run: npm run build --workspace=common
      - name: Integration tests
        working-directory: backend/auth-service
        run: npm run test:e2e
        env:
          CI: true
          RYUK_DISABLED: "true"
          JWT_SECRET: ci-integration-test-secret-must-be-long-enough-for-hs256

  build:
    name: TypeScript Build
    runs-on: ubuntu-latest
    needs: lint-and-unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npm run build --workspace=common
      - working-directory: backend
        run: npm run build --workspace=auth-service
      - uses: actions/upload-artifact@v4
        with:
          name: auth-dist
          path: backend/auth-service/dist/
          retention-days: 7

  docker-build-and-scan:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [integration-test, build]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/auth-service/Dockerfile
          push: false
          load: true
          tags: auth-service:${{ github.sha }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: auth-service:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif