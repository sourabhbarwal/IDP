name: logging-service CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/logging-service/**"
      - "backend/common/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/tsconfig.base.json"
      - ".github/workflows/logging-service-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/logging-service/**"
      - "backend/common/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/tsconfig.base.json"
      - ".github/workflows/logging-service-ci.yml"

env:
  NODE_VERSION: "20"

jobs:
  lint-and-unit-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npm run build --workspace=common
      - working-directory: backend/logging-service
        run: npm run lint
      - working-directory: backend/logging-service
        run: npm run test:cov
        env: { CI: true }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logging-svc-coverage
          path: backend/logging-service/coverage/

  build:
    name: TypeScript Build
    runs-on: ubuntu-latest
    needs: lint-and-unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npm run build --workspace=common
      - working-directory: backend
        run: npm run build --workspace=logging-service

  docker-build-and-scan:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/logging-service/Dockerfile
          push: false
          load: true
          tags: logging-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: logging-service:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true