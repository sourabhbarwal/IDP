# Reusable workflow — called by each service's CI workflow
# and by the matrix CD pipeline
name: Build and Push Image (reusable)

on:
  workflow_call:
    inputs:
      service:
        description: "Service name (e.g. auth-service)"
        required: true
        type: string
      dockerfile:
        description: "Relative path to Dockerfile"
        required: true
        type: string
      image_name:
        description: "GHCR image name (e.g. idp-auth-service)"
        required: true
        type: string
      push:
        description: "Whether to push the image (false for PR builds)"
        required: false
        type: boolean
        default: true
    outputs:
      image_tag:
        description: "Full image tag that was pushed"
        value: ${{ jobs.build-push.outputs.image_tag }}
    secrets:
      GHCR_TOKEN:
        required: true

jobs:
  build-push:
    name: Build & Push ${{ inputs.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
          tags: |
            # SHA tag — immutable, every commit
            type=sha,prefix=sha-,format=short
            # latest — always points to HEAD of main
            type=raw,value=latest,enable={{is_default_branch}}
            # Semver — on GitHub releases (v1.2.3)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=IDP Platform - ${{ inputs.service }}
            org.opencontainers.image.vendor=IDP Platform
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          # Use GitHub Actions cache for faster builds
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}
          # Multi-platform for production (arm64 for AWS Graviton, amd64 for x86)
          platforms: linux/amd64

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:latest
          format: sarif
          output: trivy-${{ inputs.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true