name: CodeQL Security Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly on Monday at 02:00 UTC
    - cron: '0 2 * * 1'

jobs:
  analyze:
    name: CodeQL Analysis (TypeScript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # CodeQL query suites — security-and-quality is comprehensive
          queries: security-and-quality

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build all services
        working-directory: backend
        run: |
          npm run build --workspace=common
          npm run build --workspace=auth-service
          npm run build --workspace=service-catalog-service
          npm run build --workspace=repository-service
          npm run build --workspace=template-service
          npm run build --workspace=deployment-service
          npm run build --workspace=monitoring-service
          npm run build --workspace=logging-service
          npm run build --workspace=alert-service
          npm run build --workspace=notification-service
          npm run build --workspace=audit-service
          npm run build --workspace=cost-service

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: typescript-security