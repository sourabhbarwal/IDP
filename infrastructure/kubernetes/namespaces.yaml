# All 14 IDP Platform service namespaces
# Apply with: kubectl apply -f infrastructure/kubernetes/namespaces.yaml
apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: dev-auth-service
      labels: { idp-platform: "true", environment: dev }
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: dev-service-catalog-service
      labels: { idp-platform: "true", environment: dev }
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: dev-repository-service
      labels: { idp-platform: "true", environment: dev }
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: dev-template-service
      labels: { idp-platform: "true", environment: dev }
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: dev-deployment-service
      labels: { idp-platform: "true", environment: dev }
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: dev-monitoring-service
      labels: { idp-platform: "true", environment: dev }
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: dev-logging-service
      labels: { idp-platform: "true", environment: dev }
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: dev-alert-service
      labels: { idp-platform: "true", environment: dev }
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: dev-notification-service
      labels: { idp-platform: "true", environment: dev }
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: dev-audit-service
      labels: { idp-platform: "true", environment: dev }
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: dev-cost-service
      labels: { idp-platform: "true", environment: dev }
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: dev-ai-copilot-service
      labels: { idp-platform: "true", environment: dev }
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: dev-realtime-service
      labels: { idp-platform: "true", environment: dev }
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: dev-dora-service
      labels: { idp-platform: "true", environment: dev }
