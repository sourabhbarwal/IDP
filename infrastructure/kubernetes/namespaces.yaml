# Namespace automation per ADR-0001/ADR-0008: <env>-<service-name>
# Apply: kubectl apply -f infrastructure/kubernetes/namespaces.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    managed-by: idp-platform
    purpose: shared-infrastructure
---
apiVersion: v1
kind: Namespace
metadata:
  name: dev-auth-service
  labels:
    managed-by: idp-platform
    environment: dev
    service: auth-service
---
apiVersion: v1
kind: Namespace
metadata:
  name: dev-service-catalog-service
  labels:
    managed-by: idp-platform
    environment: dev
    service: service-catalog-service
---
apiVersion: v1
kind: Namespace
metadata:
  name: dev-repository-service
  labels:
    managed-by: idp-platform
    environment: dev
    service: repository-service
---
apiVersion: v1
kind: Namespace
metadata:
  name: dev-template-service
  labels:
    managed-by: idp-platform
    environment: dev
    service: template-service
---
apiVersion: v1
kind: Namespace
metadata:
  name: dev-frontend
  labels:
    managed-by: idp-platform
    environment: dev
    service: frontend
---
apiVersion: v1
kind: Namespace
metadata:
  name: dev-deployment-service
  labels:
    managed-by: idp-platform
    environment: dev
    service: deployment-service