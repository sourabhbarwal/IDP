apiVersion: v1
kind: Service
metadata:
  name: {{ include "idp-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "idp-service.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "idp-service.fullname" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  type: ClusterIP