# Default values — every consuming chart overrides these
nameOverride: ""
fullnameOverride: ""

image:
  repository: idp-platform/placeholder
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  port: 80
  targetPort: 3000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

healthCheck:
  livenessPath: /health
  readinessPath: /health/ready
  initialDelaySeconds: 15
  periodSeconds: 20

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

env: {}
envFrom: []

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

podSecurityContext:
  fsGroup: 1000

serviceAccount:
  create: false
  name: ""