idp-service:
  nameOverride: notification-service
  image:
    repository: idp-platform/notification-service
    tag: local
  service:
    port: 80
    targetPort: 3009
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    minReplicas: 1
    maxReplicas: 3
  env:
    NODE_ENV: production
    PORT: "3009"
    JWT_ISSUER: idp-platform
  secretData:
    JWT_SECRET: local-kind-cluster-secret-change-for-real-deployments
