user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ── Logging ──────────────────────────────────────────────────────────────
  log_format main
    '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for" '
    'rt=$request_time urt=$upstream_response_time';

  access_log /var/log/nginx/access.log main;

  # ── Performance ───────────────────────────────────────────────────────────
  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 10m;
  gzip on;
  gzip_types text/plain application/json application/javascript text/css;

  # ── Security ──────────────────────────────────────────────────────────────
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # ── Upstreams ─────────────────────────────────────────────────────────────
  # Using Docker Compose service names as upstream hostnames.
  # Nginx resolves these via Docker's internal DNS.

  upstream auth_service {
    server auth-service:3001;
    keepalive 32;
  }

  upstream catalog_service {
    server service-catalog-service:3002;
    keepalive 32;
  }

  upstream repository_service {
    server repository-service:3003;
    keepalive 32;
  }

  upstream template_service {
    server template-service:3004;
    keepalive 32;
  }

  upstream deployment_service {
    server deployment-service:3005;
    keepalive 32;
  }

  upstream monitoring_service {
    server monitoring-service:3006;
    keepalive 32;
  }

  upstream logging_service {
    server logging-service:3007;
    keepalive 32;
  }

  upstream alert_service {
    server alert-service:3008;
    keepalive 32;
  }

  upstream notification_service {
    server notification-service:3009;
    keepalive 32;
  }

  upstream audit_service {
    server audit-service:3010;
    keepalive 32;
  }

  upstream cost_service {
    server cost-service:3011;
    keepalive 32;
  }

  upstream copilot_service {
    server ai-copilot-service:3012;
    keepalive 32;
  }

  upstream realtime_service {
    server realtime-service:3013;
    keepalive 32;
  }

  upstream dora_service {
    server dora-service:3014;
    keepalive 16;
  }
  
  upstream frontend_app {
    server frontend:8080;
    keepalive 16;
  }

  # ── Rate limiting zones ───────────────────────────────────────────────────
  # 10 requests/second per IP for auth endpoints
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
  # 100 requests/second per IP for general API
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

  # ── Main server ───────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name _;

    # Health check endpoint (no auth, no rate limit)
    location = /health {
      access_log off;
      add_header Content-Type application/json always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      return 200 '{"status":"UP","service":"nginx-gateway"}';
    }

    # ── Auth Service ─────────────────────────────────────────────────────
    location /api/v1/auth/ {
      limit_req zone=auth_limit burst=20 nodelay;
      limit_req_status 429;

      proxy_pass http://auth_service;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
      proxy_connect_timeout 5s;
    }

    # ── Service Catalog ───────────────────────────────────────────────────
    location /api/v1/services {
      limit_req zone=api_limit burst=50 nodelay;
      proxy_pass http://catalog_service;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    # ── Repository Service ────────────────────────────────────────────────
    location /api/v1/repositories {
      limit_req zone=api_limit burst=20 nodelay;
      proxy_pass http://repository_service;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # ── Template Service ──────────────────────────────────────────────────
    location /api/v1/templates {
      limit_req zone=api_limit burst=20 nodelay;
      proxy_pass http://template_service;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Template generation can take a few seconds
      proxy_read_timeout 60s;
    }

    # ── Deployment Service ────────────────────────────────────────────────
    location /api/v1/deployments {
      limit_req zone=api_limit burst=10 nodelay;
      proxy_pass http://deployment_service;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Deployments take time
      proxy_read_timeout 120s;
    }

    # ── Monitoring Service ────────────────────────────────────────────────
    location /api/v1/metrics {
      limit_req zone=api_limit burst=30 nodelay;
      proxy_pass http://monitoring_service;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    # ── Logging Service ───────────────────────────────────────────────────
    location /api/v1/logs {
      limit_req zone=api_limit burst=30 nodelay;
      proxy_pass http://logging_service;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    # ── Alert Service ─────────────────────────────────────────────────────
    location /api/v1/alerts {
      limit_req zone=api_limit burst=30 nodelay;
      proxy_pass http://alert_service;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    # ── Notification Service ──────────────────────────────────────────────
    location /api/v1/notifications {
      limit_req zone=api_limit burst=20 nodelay;
      proxy_pass http://notification_service;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    # ── Audit Service ─────────────────────────────────────────────────────
    location /api/v1/audit {
      limit_req zone=api_limit burst=30 nodelay;
      proxy_pass http://audit_service;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    # ── Cost Service ──────────────────────────────────────────────────────
    location /api/v1/cost {
      limit_req zone=api_limit burst=20 nodelay;
      proxy_pass http://cost_service;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    # ── AI Copilot Service ────────────────────────────────────────────────
    location /api/v1/copilot {
      limit_req zone=api_limit burst=10 nodelay;
      proxy_pass http://copilot_service;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      proxy_connect_timeout 10s;
      proxy_buffering off;
      proxy_cache off;
    }

    # ── Realtime Service (WebSocket upgrade) ─────────────────────────────
    location /socket.io/ {
      proxy_pass http://realtime_service;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;  # Keep WebSocket alive for 1 hour
      proxy_send_timeout 3600s;
    }

    location /api/v1/events {
      proxy_pass http://realtime_service;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }

    # ── Frontend ──────────────────────────────────────────────────────────
    location / {
      proxy_pass http://frontend_app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;

      # Cache static assets
      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        proxy_pass http://frontend_app;
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
      }
    }

    location /api/v1/dora {
      limit_req zone=api_limit burst=20 nodelay;
      proxy_pass http://dora_service;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }

    # ── Error pages ───────────────────────────────────────────────────────
    error_page 429 @rate_limited;
    location @rate_limited {
      default_type application/json;
      return 429 '{"type":"https://idp.platform/errors/rate-limit","title":"TOO_MANY_REQUESTS","status":429,"detail":"Rate limit exceeded. Please slow down."}';
    }

    error_page 502 503 504 @upstream_error;
    location @upstream_error {
      default_type application/json;
      return 502 '{"type":"https://idp.platform/errors/upstream","title":"SERVICE_UNAVAILABLE","status":502,"detail":"Upstream service is temporarily unavailable."}';
    }
  }
}