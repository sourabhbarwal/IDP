global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: idp-platform-compose
    environment: development

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: ['auth-service:3001']
        labels:
          service: auth-service

  - job_name: service-catalog-service
    metrics_path: /metrics
    static_configs:
      - targets: ['service-catalog-service:3002']
        labels:
          service: service-catalog-service

  - job_name: repository-service
    metrics_path: /metrics
    static_configs:
      - targets: ['repository-service:3003']
        labels:
          service: repository-service

  - job_name: template-service
    metrics_path: /metrics
    static_configs:
      - targets: ['template-service:3004']
        labels:
          service: template-service

  - job_name: deployment-service
    metrics_path: /metrics
    static_configs:
      - targets: ['deployment-service:3005']
        labels:
          service: deployment-service

  - job_name: monitoring-service
    metrics_path: /metrics
    static_configs:
      - targets: ['monitoring-service:3006']
        labels:
          service: monitoring-service

  - job_name: logging-service
    metrics_path: /metrics
    static_configs:
      - targets: ['logging-service:3007']
        labels:
          service: logging-service

  - job_name: alert-service
    metrics_path: /metrics
    static_configs:
      - targets: ['alert-service:3008']
        labels:
          service: alert-service

  - job_name: notification-service
    metrics_path: /metrics
    static_configs:
      - targets: ['notification-service:3009']
        labels:
          service: notification-service

  - job_name: audit-service
    metrics_path: /metrics
    static_configs:
      - targets: ['audit-service:3010']
        labels:
          service: audit-service

  - job_name: cost-service
    metrics_path: /metrics
    static_configs:
      - targets: ['cost-service:3011']
        labels:
          service: cost-service

  - job_name: ai-copilot-service
    metrics_path: /metrics
    static_configs:
      - targets: ['ai-copilot-service:3012']
        labels:
          service: ai-copilot-service