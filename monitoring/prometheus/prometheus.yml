global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local-docker-compose

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        # Docker Compose DNS — alertmanager service name
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Scrape all IDP Platform NestJS services
  # Docker Compose service names resolve inside the compose network
  - job_name: auth-service
    static_configs:
      - targets: ['auth-service:3001']
    metrics_path: /metrics

  - job_name: service-catalog-service
    static_configs:
      - targets: ['service-catalog-service:3002']
    metrics_path: /metrics

  - job_name: repository-service
    static_configs:
      - targets: ['repository-service:3003']
    metrics_path: /metrics

  - job_name: template-service
    static_configs:
      - targets: ['template-service:3004']
    metrics_path: /metrics

  - job_name: deployment-service
    static_configs:
      - targets: ['deployment-service:3005']
    metrics_path: /metrics

  - job_name: monitoring-service
    static_configs:
      - targets: ['monitoring-service:3006']
    metrics_path: /metrics

  - job_name: logging-service
    static_configs:
      - targets: ['logging-service:3007']
    metrics_path: /metrics

  - job_name: alert-service
    static_configs:
      - targets: ['alert-service:3008']
    metrics_path: /metrics

  - job_name: notification-service
    static_configs:
      - targets: ['notification-service:3009']
    metrics_path: /metrics

  - job_name: audit-service
    static_configs:
      - targets: ['audit-service:3010']
    metrics_path: /metrics

  - job_name: cost-service
    static_configs:
      - targets: ['cost-service:3011']
    metrics_path: /metrics

  - job_name: ai-copilot-service
    static_configs:
      - targets: ['ai-copilot-service:3012']
    metrics_path: /metrics