groups:
  - name: idp-platform-alerts
    interval: 30s
    rules:
      # ── Pod health ─────────────────────────────────────────────────────────
      - alert: PodCrashLooping
        expr: |
          increase(kube_pod_container_status_restarts_total[10m]) > 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} is crash-looping"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted {{ $value }} times in the last 10 minutes."

      - alert: PodNotReady
        expr: |
          kube_pod_status_ready{condition="true"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} is not ready"

      # ── HTTP error rate ─────────────────────────────────────────────────────
      - alert: HighErrorRate
        expr: |
          sum(rate(http_request_duration_ms_count{status_code=~"5.."}[5m])) by (job)
          /
          sum(rate(http_request_duration_ms_count[5m])) by (job)
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate on {{ $labels.job }}"
          description: "Error rate is {{ $value | humanizePercentage }} on {{ $labels.job }}"

      # ── Latency ────────────────────────────────────────────────────────────
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_ms_bucket[5m])) by (le, job)) > 2000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on {{ $labels.job }}"
          description: "p95 latency is {{ $value }}ms on {{ $labels.job }}"

      # ── Memory ────────────────────────────────────────────────────────────
      - alert: HighMemoryUsage
        expr: |
          container_memory_working_set_bytes{container!=""} 
          / container_spec_memory_limit_bytes{container!=""} > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.container }}"
          description: "Container {{ $labels.container }} is using {{ $value | humanizePercentage }} of its memory limit."