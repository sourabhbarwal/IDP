[databases]
; Route all connections to the shared 'idp' database
; Format: alias = host=<host> dbname=<dbname> port=<port>
idp = host=postgres dbname=idp port=5432

[pgbouncer]
; Listen on all interfaces inside Docker network
listen_addr = 0.0.0.0
listen_port = 5432

; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Pool mode: transaction = connection returned after each transaction
; This is the most efficient for stateless NestJS services
pool_mode = transaction

; Maximum connections PgBouncer will open to PostgreSQL
server_pool_size = 20

; Maximum clients that can connect to PgBouncer
max_client_conn = 200

; Default pool size per user/database pair
default_pool_size = 10

; Minimum pool size (always kept alive)
min_pool_size = 2

; How long to wait for a server connection before giving up
server_connect_timeout = 15

; Idle server connections are closed after this many seconds
server_idle_timeout = 600

; Client connections are closed after this many seconds of inactivity
client_idle_timeout = 0

; Log connections and disconnections (disable in high-traffic prod)
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

; Admin database for monitoring
admin_users = idp

; Ignore startup parameters that NestJS TypeORM sends
; These are safe to ignore in transaction pool mode
ignore_startup_parameters = extra_float_digits,search_path